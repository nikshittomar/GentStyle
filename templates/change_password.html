{% extends 'basee.html' %}
{% load static %}
{% block content %}

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #f5f5f5;
  }

  .dashboard-wrapper {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 120px 20px 50px 20px;
    gap: 30px;
  }

  /* Sidebar */
  .dashboard-sidebar {
    flex: 0 0 250px;
    background: rgba(255,255,255,0.05);
    
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.05);
  }

  .dashboard-sidebar h3 {
    color: #000;
    margin-bottom: 15px;
    font-weight: 600;
  }

  .dashboard-sidebar ul {
    list-style: none;
    padding: 0;
  }

  .dashboard-sidebar li {
    margin-bottom: 12px;
  }

  .dashboard-sidebar li a {
    text-decoration: none;
    color: #000;
    font-weight: 500;
    transition: 0.3s;
  }

  .dashboard-sidebar li a:hover, .dashboard-sidebar li a.active {
    color: #1e88e5;
  }

  /* Card */
  .dashboard-card {
    flex: 1;
    max-width: 520px;
    background: rgba(237,228,228,0.05);
    border: 2px solid rgba(0,0,0,0.95);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
    text-align: center;
    transition: all 0.3s ease;
  }

  .dashboard-card h4 {
    font-weight: 700;
    margin-bottom: 30px;
    color: #000;
  }

  .form-group {
    margin-bottom: 20px;
    position: relative;
    text-align: left;
  }

  .form-control {
    width: 100%;
    padding: 12px 45px 12px 15px;
    border-radius: 25px;
    border: 2px solid #000;
    background: transparent;
    color: #000;
    font-size: 15px;
    outline: none;
    transition: 0.3s ease;
  }

  .form-control:focus {
    border-color: #555;
    background: rgba(0,0,0,0.05);
  }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #000000ff;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s ease;
  }

  .btn:hover {
    background: #fff;
    color: #1e88e5;
    border: 2px solid #1e88e5;
  }

  a.text-decoration-none {
    color: #000;
    transition: 0.3s;
    margin: 12px 0 0 0;
    text-decoration: none;
  }

  a.text-decoration-none:hover {
    color: #1e88e5;
    text-decoration: none;
  }

  @media(max-width:768px){
    .dashboard-wrapper {
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    .dashboard-card {
      max-width: 100%;
    }

    .dashboard-sidebar {
      width: 100%;
      margin-bottom: 20px;
    }
  }
</style>

<div class="dashboard-wrapper">
  <!-- Sidebar -->
  {% include 'dashboard_sidebar.html' %}

  <!-- Change Password Card -->
  <div class="dashboard-card">
    <h4>Change Password</h4>

    {% include 'alerts.html' %}

    <form action="{% url 'change_password' %}" method="POST">
      {% csrf_token %}
      <div class="form-group">
        <input type="password" name="current_password" class="form-control" placeholder="Current Password" required>
      </div>
      <div class="form-group">
        <input type="password" name="new_password" class="form-control" placeholder="New Password" required>
      </div>
      <div class="form-group">
        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
      </div>
      <button type="submit" class="btn">Update Password</button>
    </form>

    <p class="text-center mt-4 mb-0">
      <a href="{% url 'dashboard' %}" class="text-decoration-none">← Back to Dashboard</a>
    </p>
  </div>
</div>

{% endblock %}
