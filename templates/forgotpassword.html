{% extends 'basee.html' %}
{% load static %}
{% block content %}

<style>
  .forgot-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    padding: 40px 20px;
  }

  .forgot-card {
    width: 100%;
    max-width: 450px;
    background: rgba(237, 228, 228, 0.05);
    border: 2px solid rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(255,255,255,0.1);
    text-align: center;
    transition: all 0.3s ease;
    margin-top: 120px;
  }

  .forgot-card:hover {
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
    transform: translateY(-3px);
  }

  .forgot-card h2 {
    font-weight: 700;
    margin-bottom: 25px;
    letter-spacing: 1px;
    color: #000;
  }

  .form-group {
    margin-bottom: 20px;
    text-align: left;
  }

  .form-control {
    width: 100%;
    padding: 12px 15px;
    border-radius: 25px;
    border: 2px solid #000;
    background: transparent;
    color: #000;
    font-size: 15px;
    outline: none;
    transition: 0.3s ease;
  }

  .form-control:focus {
    border-color: #555;
    background: rgba(0,0,0,0.05);
  }

  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #000;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s ease;
  }

  .btn:hover {
    background: #fff;
    color: #000;
    border: 2px solid #000;
  }

  .back-link {
    display: block;
    text-align: right;
    margin-bottom: 20px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
  }

  .back-link:hover {
    color: #000;
    text-decoration: underline;
  }

  .signup {
    margin-top: 20px;
    color: #333;
    font-size: 14px;
  }

  .signup a {
    color: #000;
    font-weight: 600;
    text-decoration: none;
    transition: 0.3s;
  }

  .signup a:hover {
    text-decoration: underline;
  }

  @media (max-width: 768px) {
    .forgot-card {
      padding: 30px 20px;
      margin-top: 5px;
    }
  }

  @media (max-width: 480px) {
    .forgot-card {
      padding: 30px 20px;
      margin-top: 5px;
    }
    .forgot-card h2 {
      font-size: 22px;
    }
  }
</style>

<div class="forgot-wrapper">
  <div class="forgot-card">
    {% include 'alerts.html' %}
    <h2>Forgot Password</h2>

    <form action="{% url 'forgotpassword' %}" method="POST">
      {% csrf_token %}
      
      <div class="form-group">
        <input type="email" class="form-control" placeholder="Email Address" name="email" required>
      </div>

      <a href="{% url 'login' %}" class="back-link">Got password? Login</a>

      <button type="submit" class="btn">Submit</button>
    </form>

    <p class="signup">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
  </div>
</div>

{% endblock %}
