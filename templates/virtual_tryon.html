{% extends 'basee.html' %}
{% load static %}

{% block content %}
<div class="tryon-container">
    <h1>Virtual Try-On</h1>

    <div class="tryon-product">
        <h2>{{ product.product_name }}</h2>
        <p>Price: ₹{{ product.price }}</p>

        <img src="{{ product.image.url }}"
             alt="{{ product.product_name }}"
             class="product-image">

        <p>Upload your photo to try this product on virtually.</p>

        <form>
            <label for="person-image">Upload your photo:</label>
            <input type="file"
                   id="person-image"
                   accept="image/*"
                   required>

            <button type="submit" disabled>
                Generate Try-On
            </button>
        </form>

        <p class="notice">
            The try-on generator will be connected in the next step.
        </p>
    </div>
</div>

<style>
<style>
.tryon-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 35px 20px 60px;
    text-align: center;
    min-height: 550px;
    box-sizing: border-box;
}

.tryon-container h1 {
    margin: 0 0 25px;
    font-size: 32px;
    line-height: 1.3;
    position: static;
}

.tryon-product {
    margin-top: 20px;
}

.tryon-product h2 {
    margin: 15px 0 5px;
    font-size: 23px;
}

.product-image {
    display: block;
    width: 250px;
    max-width: 100%;
    height: auto;
    margin: 20px auto;
    border-radius: 12px;
}

input[type="file"] {
    display: block;
    margin: 15px auto;
    max-width: 100%;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #111;
    color: white;
    cursor: pointer;
}

button:disabled {
    background: #999;
    cursor: not-allowed;
}

.notice {
    color: #666;
    font-size: 14px;
    margin-top: 10px;
}

@media (max-width: 600px) {
    .tryon-container {
        padding: 25px 15px 40px;
    }

    .tryon-container h1 {
        font-size: 27px;
    }
}
</style>
{% endblock %}
