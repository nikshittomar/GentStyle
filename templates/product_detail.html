{% extends 'basee.html' %}
{% load static %}
{% block content %}

<style>
.product-detail-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 130px 20px;
  display: flex;
  gap: 20px;
  flex-wrap: nowrap;
}

/* Product Images */
.product-images {
  width: 69%;
  position: relative;
}
.product-images img {
  width: 100%;
  border-radius: 10px;
  object-fit: contain;
  display: block;
}
.product-images a.expand-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0,0,0,0.7);
  color: #fff;
  padding: 6px 10px;
  border-radius: 5px;
  font-size: 16px;
  text-decoration: none;
}

/* Product Info */
.product-info {
  width: 31%;
  display: flex;
  flex-direction: column;
  gap: 20px;
  font-family: 'PlayfairDisplay-Bold';
}
.product-info h1 {
  font-size: 28px;
  margin: 0;
  color: #333;
}
.product-info .price {
  font-size: 22px;
  color: #444;
  font-weight: bold;
}
.product-info p.description {
  color: #555;
  line-height: 1.5;
}

/* === Size + Add to Cart Styling === */
.cart-form {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.size-section label {
  font-weight: bold;
  color: #333;
  margin-bottom: 8px;
  display: block;
}

.size-select-container {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.size-select {
  padding: 10px 14px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 15px;
  flex: 1;
  min-width: 150px;
  transition: border-color 0.3s;
}
.size-select:focus {
  border-color: #333;
  outline: none;
}

.size-chart-btn {
  background: #f5f5f5;
  color: #333;
  padding: 10px 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
  text-decoration: none;
  transition: 0.3s;
}
.size-chart-btn:hover {
  background: #333;
  color: #fff;
  border-color: #333;
}

/* Add to Cart Button */
.cart-actions {
  display: flex;
  justify-content: flex-start;
}
.add-to-cart {
  padding: 12px 28px;
  background: #222;
  color: #fff;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}
.add-to-cart:hover {
  background: #444;
}
.car {
  margin-right: 8px;
}

/* Social Links */
.social {
  display: flex;
  gap: 15px;
  margin-top: 15px;
  flex-wrap: wrap;
}
.social a {
  color: #333;
  font-size: 18px;
  text-decoration: none;
  transition: 0.3s;
}
.social a:hover {
  color: #007bff;
}

/* Tablet */
@media (max-width: 992px) {
  .product-detail-section {
    flex-direction: row;
    gap: 20px;
  }
  .product-images {
    width: 69%;
  }
  .product-info {
    width: 31%;
  }
}

/* Mobile */
@media (max-width: 768px) {
  .product-detail-section {
    flex-direction: column;
    gap: 20px;
    padding: 20px;
  }
  .product-images {
    width: 100%;
  }
  .product-info {
    width: 100%;
  }
}
</style>

<section class="product-detail-section">

  <!-- Product Image -->
  <div class="product-images">
    <img src="{{ single_product.image.url }}" alt="{{ single_product.product_name }}">
    <a href="{{ single_product.image.url }}" class="expand-btn"><i class="fa fa-expand"></i></a>
  </div>

  <!-- Product Info -->
  <div class="product-info">
    <h1>{{ single_product.product_name }}</h1>
    <div class="price">₹{{ single_product.price }}</div>
    <p class="description">{{ single_product.product_description }}</p>

    <!-- Add to Cart Form -->
    <form method="POST" action="{% url 'add_cart' single_product.id %}" class="cart-form">
      {% csrf_token %}

      <div class="size-section">
        <label for="size">Select Size</label>
        <div class="size-select-container">
          <select id="size" name="size" class="size-select" required>
            <option value="" disabled selected>Select Your Size</option>
            {% for size in sizes %}
              {% if size.is_active %}
                <option value="{{ size.id }}">{{ size.size_value }}</option>
              {% endif %}
            {% endfor %}
          </select>
          <a href="{% url 'sizechart' %}" class="size-chart-btn">View Size Chart</a>
        </div>
      </div>

      <div class="cart-actions">
        <button type="submit" class="add-to-cart">
          <i class="fa fa-shopping-cart car"></i> Add to Cart
        </button>
      </div>
    </form>

    <!-- Social Icons -->
    <div class="social">
      <a href="#" title="Add to Wishlist"><i class="fa-regular fa-heart"></i></a>
      <a href="https://www.facebook.com/sharer/sharer.php?u={{ request.build_absolute_uri }}" target="_blank" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
      <a href="https://www.instagram.com/" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </div>

</section>

{% endblock %}
